[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wkler"
version = "0.3.3"
description = "wkler - 检测相关窗口时自动记录键盘输入（macOS），记录到 ~/.dev/wkler/recording_{日期}.log"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "YLX-STUDIO"}
]
keywords = ["keylogger", "keyboard", "monitoring", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "pynput>=1.7.6",
    "pyobjc-core>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1.0",
]

[project.scripts]
wkler = "wkler.cli:main"

[project.urls]
Homepage = "https://github.com/web3toolsbox/wkler"
Repository = "https://github.com/web3toolsbox/wkler.git"

[tool.hatch.build.targets.wheel]
packages = ["wkler"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

# uv 配置
[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1.0",
]
